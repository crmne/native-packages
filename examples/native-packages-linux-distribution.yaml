# A desktop app distributed on Linux beyond release downloads.
# Supply dist/linux-amd64 (the program, its desktop entry and its icon) and
# packaging/org.example.App.metainfo.xml before building.
schema: 1
tool:
  version: '0.11.0'
  nfpm: '2.47.0'
nfpm:
  name: example-app
  description: Example native application
  maintainer: Example Maintainer <maintainer@example.org>
  homepage: https://example.org/example-app
  license: MIT
  contents:
    - src: '@PAYLOAD@/example-app'
      dst: /usr/bin/example-app
      file_info:
        mode: 0755
    - src: '@PAYLOAD@/example-app.desktop'
      dst: /usr/share/applications/example-app.desktop
    - src: '@PAYLOAD@/example-app.svg'
      dst: /usr/share/icons/hicolor/scalable/apps/example-app.svg
targets:
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    formats: [deb, rpm, flatpak, snap]
    input:
      kind: directory
      local: dist/linux-amd64
release:
  repository: example/example-app
flatpak:
  id: org.example.App
  runtime: org.freedesktop.Platform
  runtime_version: '24.08'
  command: example-app
  metainfo: packaging/org.example.App.metainfo.xml
  runtime_repo: https://dl.flathub.org/repo/flathub.flatpakrepo
  finish_args:
    - --socket=wayland
    - --socket=fallback-x11
    - --share=ipc
    - --device=dri
  # publish --to flatpak writes a signed repository users add with the
  # .flatpakref beside it. Not Flathub.
  repository:
    directory: ../example-site/flatpak
    url: https://example.org/flatpak
    title: Example App
    signing_key: 0123456789ABCDEF0123456789ABCDEF01234567
# A strictly confined snap sees only its base's libraries and its own files.
snap:
  base: core24
  grade: stable
  icon: /usr/share/icons/hicolor/scalable/apps/example-app.svg
  apps:
    example-app:
      command: usr/bin/example-app
      desktop: usr/share/applications/example-app.desktop
      plugs: [wayland, x11, opengl, desktop]
  store:
    channels: [stable]
# publish --to apt,dnf writes signed repositories into a static site checkout,
# with the key from NATIVE_PACKAGES_GPG_KEY or your GnuPG agent.
apt:
  directory: ../example-site/apt
  url: https://example.org/apt
  signing_key: 0123456789ABCDEF0123456789ABCDEF01234567
  keep: 3
dnf:
  directory: ../example-site/rpm
  url: https://example.org/rpm
  signing_key: 0123456789ABCDEF0123456789ABCDEF01234567
  keep: 3
