name: Release gem

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to test and publish without moving it
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gem-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Verify release tag, commit and version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(ruby -Ilib -r native_packages -e 'puts NativePackages::VERSION')
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          prerelease=$(ruby -rrubygems/version -e 'puts Gem::Version.new(ARGV.fetch(0)).prerelease?' "$version")
          published_prerelease=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'if .isDraft then error("Release must be published") else .isPrerelease end')
          test "$prerelease" = "$published_prerelease"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/test.yml
    with:
      source-ref: ${{ needs.validate.outputs.sha }}

  publish:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - uses: actions/download-artifact@v4
        with:
          name: gem-ruby-4.0
          path: pkg
      - name: Verify tested gem
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          ruby -rrubygems/package -e 'p = Dir["pkg/*.gem"].fetch(0); s = Gem::Package.new(p).spec; abort "tag/version mismatch" unless ENV.fetch("RELEASE_TAG") == "v#{s.version}"'
      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_AUTH_TOKEN }}
        run: |
          test -n "$GEM_HOST_API_KEY" || { echo 'Configure RUBYGEMS_AUTH_TOKEN for this repository, as in RubyLLM.' >&2; exit 1; }
          output=$(gem push --host https://rubygems.org pkg/*.gem 2>&1) || {
            echo "$output"
            if echo "$output" | grep -qi 'Repushing of gem versions is not allowed'; then exit 0; fi
            exit 1
          }
          echo "$output"
      - name: Publish to GitHub Packages
        env:
          GEM_HOST_API_KEY: Bearer ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          output=$(gem push --host "https://rubygems.pkg.github.com/$OWNER" pkg/*.gem 2>&1) || {
            echo "$output"
            if echo "$output" | grep -qi 'already been pushed'; then exit 0; fi
            exit 1
          }
          echo "$output"
      - name: Attach tested gem to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" pkg/*.gem --clobber
