name: Package an application

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      publish:
        type: boolean
        default: false
      targets:
        description: Comma-separated target IDs (empty requires all configured targets)
        type: string
        default: ''
      config:
        type: string
        default: ''
      source-artifact:
        description: Optional Actions artifact containing local build inputs
        type: string
        default: ''
      source-directory:
        type: string
        default: dist
    secrets:
      AUR_SSH_KEY:
        required: false
      AUR_KNOWN_HOSTS:
        required: false
      HOMEBREW_TAP_GITHUB_TOKEN:
        required: false
      HOMEBREW_TAP_SSH_KEY:
        required: false

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      legacy: ${{ steps.read.outputs.legacy }}
      config: ${{ steps.read.outputs.config }}
      gem-version: ${{ steps.read.outputs.gem-version }}
      nfpm-version: ${{ steps.read.outputs.nfpm-version }}
      targets: ${{ steps.read.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - id: read
        env:
          CONFIG: ${{ inputs.config }}
          TARGETS: ${{ inputs.targets }}
        run: |
          ruby -ryaml <<'RUBY'
          paths = ENV.fetch('CONFIG').empty? ? %w[native-packages.yaml native-packages.yml].select { |path| File.file?(path) } : [ENV.fetch('CONFIG')]
          abort 'multiple configuration files found' if paths.length > 1
          abort 'target selection needs native-packages.yaml' if paths.empty? && !ENV.fetch('TARGETS').strip.empty?
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |output|
            output.puts "legacy=#{paths.empty?}"
            unless paths.empty?
              path = paths.first
              abort 'invalid configuration path' if path.include?("\n") || path.include?("\r")
              config = YAML.safe_load_file(path, permitted_classes: [], aliases: false)
              requested = ENV.fetch('TARGETS').split(/[,\s]+/).reject(&:empty?).uniq.sort
              unknown = requested - config.fetch('targets').keys
              abort "unknown targets: #{unknown.join(', ')}" unless unknown.empty?
              output.puts "targets=#{requested.join(',')}"
              tool = config.fetch('tool')
              %w[version nfpm].each { |key| abort "invalid tool.#{key}" unless /\A\d+\.\d+\.\d+\z/.match?(tool.fetch(key)) }
              output.puts "config=#{path}"
              output.puts "gem-version=#{tool.fetch('version')}"
              output.puts "nfpm-version=#{tool.fetch('nfpm')}"
            end
          end
          RUBY

  legacy:
    if: needs.configuration.outputs.legacy == 'true'
    needs: configuration
    permissions:
      contents: write
    uses: ./.github/workflows/package-legacy.yml
    with:
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}
    secrets: inherit

  packages:
    if: needs.configuration.outputs.legacy != 'true'
    needs: configuration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: native-packages-${{ github.workflow }}-${{ github.ref }}-${{ needs.configuration.outputs.config }}-${{ needs.configuration.outputs.targets }}
      cancel-in-progress: false
    env:
      CONFIG: ${{ needs.configuration.outputs.config }}
      GEM_VERSION: ${{ needs.configuration.outputs.gem-version }}
      NFPM_VERSION: ${{ needs.configuration.outputs.nfpm-version }}
      VERSION: ${{ inputs.version }}
      TARGETS: ${{ needs.configuration.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install configured gem
        run: gem install native-packages --version "$GEM_VERSION" --no-document
      - name: Validate configuration
        run: native-packages --config "$CONFIG" validate
      - uses: actions/setup-go@v5
        if: inputs.version != ''
        with:
          go-version: '1.26.4'
          cache: false
      - name: Install packaging tools
        if: inputs.version != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools binutils xz-utils
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@v$NFPM_VERSION"
      - uses: actions/download-artifact@v4
        if: inputs.version != '' && inputs.source-artifact != ''
        with:
          name: ${{ inputs.source-artifact }}
          path: ${{ inputs.source-directory }}
      - name: Build packages from published release
        if: inputs.version != '' && inputs.source-artifact == ''
        run: |
          target_args=()
          IFS=',' read -r -a target_ids <<< "$TARGETS"
          for target in "${target_ids[@]}"; do
            [[ -z "$target" ]] || target_args+=(--target "$target")
          done
          native-packages --config "$CONFIG" build --release "$VERSION" --output dist/native-packages "${target_args[@]}"
      - name: Build packages from local artifacts
        if: inputs.version != '' && inputs.source-artifact != ''
        run: |
          target_args=()
          IFS=',' read -r -a target_ids <<< "$TARGETS"
          for target in "${target_ids[@]}"; do
            [[ -z "$target" ]] || target_args+=(--target "$target")
          done
          native-packages --config "$CONFIG" build --version "$VERSION" --output dist/native-packages "${target_args[@]}"
      - uses: actions/upload-artifact@v4
        if: inputs.version != ''
        with:
          name: native-packages
          path: dist/native-packages/
          include-hidden-files: true
          if-no-files-found: error
      - name: Attach packages to GitHub release
        if: inputs.publish && inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_args=()
          IFS=',' read -r -a target_ids <<< "$TARGETS"
          for target in "${target_ids[@]}"; do
            [[ -z "$target" ]] || target_args+=(--target "$target")
          done
          native-packages --config "$CONFIG" publish --from dist/native-packages --to github "${target_args[@]}"
      - name: Publish AUR recipes
        if: inputs.publish && inputs.version != '' && vars.PUBLISH_AUR == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_SSH_COMMAND: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes
        run: |
          test -n "$AUR_SSH_KEY"
          test -n "$AUR_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$AUR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          target_args=()
          IFS=',' read -r -a target_ids <<< "$TARGETS"
          for target in "${target_ids[@]}"; do
            [[ -z "$target" ]] || target_args+=(--target "$target")
          done
          native-packages --config "$CONFIG" publish --from dist/native-packages --to aur "${target_args[@]}"
      - name: Publish Homebrew recipe
        if: inputs.publish && inputs.version != '' && vars.PUBLISH_HOMEBREW == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          META_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          if [[ -n "$HOMEBREW_TAP_SSH_KEY" ]]; then
            # A deploy key with write access to the tap alone, used for the
            # tap's clone and push. insteadOf, not pushInsteadOf: git ignores
            # pushInsteadOf for a remote with an explicit push URL, which the
            # managed checkout always sets.
            install -d -m 700 ~/.ssh
            printf '%s\n' "$HOMEBREW_TAP_SSH_KEY" > ~/.ssh/homebrew_tap
            chmod 600 ~/.ssh/homebrew_tap
            curl -fsSL -H "Authorization: Bearer $META_TOKEN" https://api.github.com/meta \
              | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/github_known_hosts
            test -s ~/.ssh/github_known_hosts
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/homebrew_tap -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/github_known_hosts"
            git config --global url.ssh://git@github.com/.insteadOf https://github.com/
          elif [[ -n "$GH_TOKEN" ]]; then
            gh auth setup-git
          else
            echo "Set HOMEBREW_TAP_SSH_KEY (a deploy key with write access to the tap) or HOMEBREW_TAP_GITHUB_TOKEN" >&2
            exit 1
          fi
          target_args=()
          IFS=',' read -r -a target_ids <<< "$TARGETS"
          for target in "${target_ids[@]}"; do
            [[ -z "$target" ]] || target_args+=(--target "$target")
          done
          native-packages --config "$CONFIG" publish --from dist/native-packages --to homebrew "${target_args[@]}"
