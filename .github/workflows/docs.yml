name: Docs

on:
  pull_request:
    paths: ['docs/**', 'lib/native_packages/support.rb', '.github/workflows/docs.yml']
  push:
    branches: [main]
    tags: ['v*']
    paths: ['docs/**', 'lib/native_packages/support.rb', '.github/workflows/docs.yml']
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release tags for the versions, page history for sitemaps
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: docs
      - name: Build documentation
        run: bundle exec jekyll-vitepress build --destination _site
        env:
          JEKYLL_ENV: production

  docs:
    if: github.event_name != 'pull_request'
    uses: crmne/jekyll-vitepress-theme/.github/workflows/publish-docs.yml@v1
