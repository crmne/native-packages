name: Documentation

on:
  pull_request:
    paths: ['docs/**', 'lib/native_packages/support.rb', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'lib/native_packages/support.rb', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # sitemap lastmod comes from each page's last commit
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: docs
      - name: Build documentation
        run: bundle exec jekyll build --strict_front_matter --trace
        env:
          JEKYLL_ENV: production
      - name: Check internal links
        run: python3 scripts/check_links.py _site
      - name: Plan IndexNow submission
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: ruby ../.github/scripts/indexnow.rb plan _site "$RUNNER_TEMP/indexnow.json"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: indexnow
          path: ${{ runner.temp }}/indexnow.json
          retention-days: 1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: indexnow
      - name: Submit changed URLs to IndexNow
        run: ruby .github/scripts/indexnow.rb submit indexnow.json
