name: Package a published release

on:
  workflow_call:
    inputs:
      version:
        default: ''
        type: string
      publish:
        type: boolean
        default: false
    secrets:
      AUR_SSH_KEY:
        required: false
      AUR_KNOWN_HOSTS:
        required: false
      HOMEBREW_TAP_GITHUB_TOKEN:
        required: false

permissions:
  contents: read

env:
  BUNDLE_GEMFILE: ${{ github.workspace }}/packaging/Gemfile

jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/setup-go@v5
        if: inputs.version != ''
        with:
          go-version: '1.26.4'
          cache: false
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools binutils rpm
      - name: Install nFPM
        if: inputs.version != ''
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Validate project recipes
        run: bundle exec native-packages validate
      - name: Prepare release packages
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bundle exec native-packages prepare "$VERSION" --output dist/packaging
          bundle exec native-packages artifacts dist/packaging
      - uses: actions/upload-artifact@v4
        if: inputs.version != ''
        with:
          name: packaging
          path: dist/packaging/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.version != ''
        with:
          name: package-assets
          path: dist/package-assets/
          if-no-files-found: error

  publish-assets:
    if: inputs.publish && inputs.version != ''
    needs: recipes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: package-assets
          path: dist/package-assets
      - name: Attach packages and recipe bundle to the release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: bundle exec native-packages publish-release "$VERSION" dist/package-assets

  publish-aur:
    if: inputs.publish && vars.PUBLISH_AUR == 'true'
    needs: publish-assets
    runs-on: ubuntu-latest
    concurrency:
      group: publish-aur
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: dist/packaging
      - name: Configure AUR credentials
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          test -n "$AUR_SSH_KEY"
          test -n "$AUR_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$AUR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Publish AUR recipes
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_SSH_COMMAND: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes
        run: bundle exec native-packages publish-aur dist/packaging

  publish-homebrew:
    if: inputs.publish && vars.PUBLISH_HOMEBREW == 'true'
    needs: publish-assets
    runs-on: ubuntu-latest
    concurrency:
      group: publish-homebrew
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: dist/packaging
      - name: Publish Homebrew recipe
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          test -n "$GH_TOKEN"
          gh auth setup-git
          bundle exec native-packages stage homebrew dist/packaging
          bundle exec native-packages publish homebrew
